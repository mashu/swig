[package]
name = "swig_wasm"
version = "0.39.3"
edition = "2024"
rust-version = "1.89"
description = "WebAssembly module of swig for browsers, Web Workers and Node.js"
publish = false

[lib]
# `cdylib` is the .wasm module; `rlib` lets `cargo test` run its tests natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
swig = { path = ".." }
