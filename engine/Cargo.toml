[package]
name = "swig"
version = "0.39.7"
edition = "2024"
rust-version = "1.89"
description = "Seeded, banded affine V(D)J germline assignment with placement-DAG adjudication"

[dependencies]

[workspace]
members = ["wasm"]

[[bin]]
name = "swig"
path = "src/bin/swig.rs"
doc = false

[profile.release]
lto = "thin"
codegen-units = 1

# The tests' profile (`npm run test:engine`): release code with debug
# assertions and overflow checks, so the engine's debug invariants run in CI.
[profile.checked]
inherits = "release"
debug-assertions = true
overflow-checks = true

# Swig's WebAssembly module (`scripts/build-swig-wasm.sh`): whole-program LTO
# and no symbol names, for a smaller download.
[profile.wasm]
inherits = "release"
lto = "fat"
strip = true
