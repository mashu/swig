name: CI

on:
  # Branches only: a release tag runs this workflow from release.yml.
  push:
    branches: ['**']
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --release -- -D warnings
      # The simd128 kernel exists only in WebAssembly builds with SIMD.
      - run: cargo clippy --workspace --lib --release --target wasm32-unknown-unknown -- -D warnings
        env:
          RUSTFLAGS: -C target-feature=+simd128
      - run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      matrix:
        # x86-64 runs the AVX-512 (when present), AVX2, portable and scalar
        # kernels; AArch64 runs NEON, portable and scalar.
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --release
      - name: Accuracy at scale (20,000 reads per preset)
        run: cargo test --release --test simulated -- --ignored

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wasmtime
        run: |
          curl -sSfL https://github.com/bytecodealliance/wasmtime/releases/download/v36.0.2/wasmtime-v36.0.2-x86_64-linux.tar.xz | tar xJ
          echo "$PWD/wasmtime-v36.0.2-x86_64-linux" >> "$GITHUB_PATH"
      # The whole suite on WebAssembly with SIMD: the kernel tests compare
      # the simd128, portable and scalar kernels.
      - name: Test suite on wasm32-wasip1 with simd128
        run: cargo test --release --target wasm32-wasip1
        env:
          RUSTFLAGS: -C target-feature=+simd128
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run
      - name: Build the browser modules and the page
        run: wasm/build.sh
      - name: The modules equal the command line
        run: |
          cargo build --release
          node web/test.mjs target/release/vdj-assign
      # Playwright is installed for this step only; the repository has no
      # JavaScript dependencies.
      - name: The page from disk and from a server, and Web Workers, in Chromium, Firefox and WebKit
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium firefox webkit
          node web/browser-test.mjs target/release/vdj-assign chromium,firefox,webkit
      - uses: actions/upload-artifact@v4
        with:
          name: vdj-assign-web
          path: |
            web/
            !web/test.mjs
            !web/browser-test.mjs
            !web/page.html
            !web/app.js
            !web/standalone.js

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo check --workspace --all-targets
